<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title data-i18n="extName">Anti-Judol Shield</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <header>
    <h1><img src="icons/icon-32.png" alt="" width="18" height="18" /> <span data-i18n="extShortName"></span></h1>
    <span id="jev" class="pill" aria-live="polite">…</span>
  </header>

  <section id="unsupported" hidden>
    <p class="muted" data-i18n="popupUnsupported"></p>
  </section>

  <section id="page" hidden>
    <p class="muted small" id="pageKey"></p>
    <dl class="stats">
      <div><dt data-i18n="statScanned"></dt><dd id="sScanned">0</dd></div>
      <div><dt data-i18n="statJudol"></dt><dd id="sJudol">0</dd></div>
      <div><dt data-i18n="statSpam"></dt><dd id="sSusp">0</dd></div>
    </dl>

    <label class="row"><span data-i18n="popupPageOn"></span><input type="checkbox" id="pageOn" role="switch" /></label>
    <p class="muted small" id="reason"></p>
    <label class="row"><span data-i18n="popupRevealAll"></span><input type="checkbox" id="revealAll" role="switch" /></label>
    <label class="row"><span id="siteLabel"></span><input type="checkbox" id="siteOn" role="switch" /></label>
    <button type="button" id="resetPage" class="link" data-i18n="popupResetPage"></button>
    <button type="button" id="reportPage" class="link" data-i18n="popupReportPage"></button>
    <p class="muted small" id="reportHint" aria-live="polite"></p>
  </section>

  <hr />
  <label class="row"><span data-i18n="popupGlobal"></span><input type="checkbox" id="globalOn" role="switch" /></label>
  <footer>
    <span class="muted small" id="allowCount"></span>
    <button type="button" id="openOptions" class="link" data-i18n="popupSettings"></button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
