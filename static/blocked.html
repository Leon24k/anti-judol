<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title data-i18n="blockedTitle">Anti-Judol Shield</title>
  <link rel="stylesheet" href="ui.css" />
  <style>
    body.blocked { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { max-width: 560px; width: 100%; border: 1px solid var(--line); border-radius: 16px; padding: 32px; text-align: center; }
    .card img { width: 72px; height: 72px; }
    .card h1 { font-size: 22px; margin: 16px 0 8px; }
    .domain { display: inline-block; font: 600 14px/1.4 ui-monospace, Menlo, monospace; background: var(--line); border-radius: 6px; padding: 4px 10px; margin: 6px 0 14px; word-break: break-all; }
    .help { text-align: left; font-size: 13px; border-left: 4px solid var(--accent); padding: 8px 12px; margin: 18px 0; }
    .actions { justify-content: center; }
    details { margin-top: 18px; text-align: left; }
    details summary { cursor: pointer; color: var(--muted); }
  </style>
</head>
<body class="blocked">
  <main class="card" aria-labelledby="title">
    <img src="icons/icon-128.png" alt="" />
    <h1 id="title" data-i18n="blockedHeading"></h1>
    <div class="domain" id="domain" data-i18n-attr="aria-label:blockedDomainAria">—</div>
    <p class="muted" data-i18n="blockedExplain"></p>

    <div class="actions">
      <button type="button" class="primary" id="back" data-i18n="blockedBack"></button>
      <button type="button" id="report" data-i18n="reportToAduan"></button>
    </div>
    <p class="muted small" id="reportHint" aria-live="polite"></p>

    <div class="help" role="note" data-i18n="blockedHelp"></div>

    <details>
      <summary data-i18n="blockedNotGambling"></summary>
      <div class="actions">
        <button type="button" id="once" data-i18n="blockedOnce"></button>
        <button type="button" id="allow" data-i18n="blockedAllow"></button>
      </div>
      <p class="muted small" id="result" aria-live="polite"></p>
    </details>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
