name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck + unit tests + build + package validation
        run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: anti-judol-extension
          path: anti-judol-*.zip
          if-no-files-found: error

  e2e:
    name: End-to-end (real Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: E2E (local mode; no API key in CI)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: bun run e2e
